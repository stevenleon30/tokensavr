name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine scan range
        id: scan_range
        run: |
          HEAD_SHA="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD_SHA")"
            fi
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo "$HEAD_SHA")"
          fi

          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog
        if: steps.scan_range.outputs.should_scan == 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.scan_range.outputs.base }}
          head: ${{ steps.scan_range.outputs.head }}
          extra_args: --only-verified

      - name: Skip TruffleHog (no diff to scan)
        if: steps.scan_range.outputs.should_scan != 'true'
        run: echo "No commit diff available for secret scan; skipping TruffleHog."
