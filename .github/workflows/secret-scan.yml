name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute scan range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # If this is a new branch push or malformed range, fall back to previous commit
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || true)"
          fi

          # Prevent trufflehog failure when BASE == HEAD
          if [[ -n "${BASE}" && "${BASE}" == "${HEAD}" ]]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || true)"
          fi

          if [[ -z "${BASE}" ]]; then
            echo "scan_mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "scan_mode=range" >> "$GITHUB_OUTPUT"
            echo "base=${BASE}" >> "$GITHUB_OUTPUT"
            echo "head=${HEAD}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog (commit range)
        if: steps.range.outputs.scan_mode == 'range'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --only-verified

      - name: Run TruffleHog (full repo fallback)
        if: steps.range.outputs.scan_mode == 'full'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
