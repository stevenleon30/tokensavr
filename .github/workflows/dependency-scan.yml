name: Dependency Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --json --audit-level=moderate > npm-audit.json || true

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-log
          path: npm-audit.json
          if-no-files-found: ignore

      - name: Fail on high or critical vulnerabilities
        run: |
          if grep -q '"severity":"high"\|"severity":"critical"' npm-audit.json 2>/dev/null; then
            echo "High or critical vulnerabilities found. Review the audit log."
            exit 1
          fi

